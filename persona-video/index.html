<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pip: Dual Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500&family=DM+Sans:wght@500;600&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />
  <style>
    :root { --bg: #111015; --fg: #f2f0ea; --muted: #8a8794; --accent: #7f8cff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 14px "DM Sans", system-ui, sans-serif; }
    body { display: grid; place-items: center; padding: 16px; }
    .player { width: min(100%, calc((100vh - 90px) * 16 / 9)); }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; background: #000; }
    .bar { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
    button { background: #23212b; color: var(--fg); border: 1px solid #34313e; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    input[type=range] { flex: 1; accent-color: var(--accent); }
    #time { font: 500 13px "JetBrains Mono", monospace; color: var(--muted); min-width: 110px; text-align: right; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="player">
    <canvas id="out" width="1280" height="720"></canvas>
    <div class="bar">
      <button id="play">▶</button>
      <input id="scrub" type="range" min="0" step="0.01" value="0" />
      <span id="time">0:00.0</span>
      <button id="rec" title="Record a real-time WebM of the canvas">● Record</button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
